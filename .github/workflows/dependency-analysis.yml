name: Dependency Analysis

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-analysis:
    uses: crowdin/.github/.github/workflows/dependency-analysis.yml@main
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
